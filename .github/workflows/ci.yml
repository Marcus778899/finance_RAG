name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: Tests and global coverage gate
        run: uv run pytest
      - name: Core logic coverage gate
        shell: bash
        run: |
          if compgen -G "backend/app/retrieval/*.py" > /dev/null; then
            uv run coverage report \
              --include='backend/app/retrieval/*,backend/app/ingest/chunker.py,backend/app/ingest/digest.py' \
              --fail-under=90
          else
            echo "core modules not present yet, skipping"
          fi
